[project]
name = "icalvalid"
version = "0.1.0"
description = "Validating parser and pretty printer for iCalendar (RFC 5545) files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "james-a514" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["icalvalid*"]
