[project]
name = "icalvalid"
version = "0.1.0"
description = "Validating parser and pretty printer for iCalendar (RFC 5545) files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "james-a514" }]
keywords = ["icalendar", "ics", "rfc5545", "calendar", "vcalendar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/james-a514/icalvalid"
Issues = "https://github.com/james-a514/icalvalid/issues"

[project.scripts]
icalvalid = "icalvalid.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["icalvalid*"]

[tool.setuptools.package-data]
icalvalid = ["py.typed"]
